<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, follow">

    <meta charset="utf-8">
    <title>Marragafay | Routing...</title>
    <script>
        (function () {
            var userLang = navigator.language || navigator.userLanguage || 'en';
            var lang = userLang.toLowerCase().substring(0, 2);
            var supportedLangs = ['en', 'fr', 'es', 'ar'];
            var targetLang = supportedLangs.indexOf(lang) !== -1 ? lang : 'en';
            window.location.replace('/' + targetLang + '/terms.html' + window.location.search + window.location.hash);
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="/en/terms.html">Marragafay</a>...</p>
  <script src="/js/booking-context.js" defer></script>
</body>
</html>
