<!DOCTYPE html>
<!-- The deployment redirect in vercel.json sends / and /index.html to /en
     before this static fallback can be served. Keep this file inert so it
     cannot act as a client-side language router if accessed directly. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="0;url=/en">
  <title>Redirecting to Marragafay</title>
</head>
<body>
  <p>Continue to <a href="/en">Marragafay</a>.</p>
</body>
</html>
